# =============================================================================
# KasugaLib Documentation — MkDocs site configuration
# =============================================================================
# This repository is a DEPLOY-ONLY repository: it holds the site configuration
# and nothing else. CI fetches the prose (the `doc/` tree of the main
# repository) into `.docs-src/` on every run, builds the site here, and pushes
# the result to the `gh-pages` branch.
#
#   prose source of truth : https://github.com/KasugaLibGroup/KasugaLibNext → doc/
#   rendered site          : gh-pages branch
#
# The documentation is bilingual: every page exists twice, as `X.md` (Chinese)
# and `X.en.md` (English), side by side in the same directory.
# =============================================================================

# --- Layout (fixed interface; the CI checkout step writes into this path) ----

# Where the fetched sources are read from. Not `docs/` — the source repository
# stores its documentation under `doc/`.
docs_dir: .docs-src/doc

# Build output. Git-ignored here; published via the gh-pages branch instead.
site_dir: site

# --- Site identity -----------------------------------------------------------

# Chinese is the default language and is what this label is written in; the
# i18n plugin overrides it with `KasugaLibNext Documentation` for the English
# build (see `plugins.i18n.languages`).
site_name: KasugaLibNext 文档

# INFERRED, NOT VERIFIED: GitHub Pages for an organisation-owned repository is
# a *project* page, served from https://<org>.github.io/<repo>/. Pages is not
# enabled yet, so the final URL has not been observed. This value feeds the
# canonical URL, `sitemap.xml` and every absolute link Material emits — once
# Pages is live, check the real URL and correct this if it differs.
site_url: https://kasugalibgroup.github.io/KasugaLib-Documentation/

# "Edit this page" links point back at the *source* repository, which is where
# the Markdown actually lives. Note the docs root is `doc/` (not `docs/`) and
# the tracked branch is `master`.
repo_url: https://github.com/KasugaLibGroup/KasugaLibNext
edit_uri: edit/master/doc/

# --- Theme -------------------------------------------------------------------

theme:
  name: material
  # Default language of the site. The i18n plugin rewrites this per locale
  # during the build, so the English tree gets `en` without extra config.
  language: zh
  features:
    # Every section directory ships a README.md that acts as that section's
    # landing page. With this feature the section heading itself links to it,
    # instead of the section showing a child entry with a duplicated title.
    # (Material treats README.md as an index page, same as index.md.)
    - navigation.indexes
    # NOT enabled on purpose: `navigation.instant`. Instant loading is
    # incompatible with the i18n plugin's language switcher — the plugin
    # logs a WARNING if both are used.

# --- Plugins -----------------------------------------------------------------

plugins:
  # Declaring `plugins:` REPLACES MkDocs' default plugin list, which contains
  # `search`, so it has to be re-declared or the search box disappears.
  - search

  - i18n:
      # `X.md` + `X.en.md` in the same directory IS the suffix layout. Do not
      # convert this to `zh/` + `en/` folders — the source repository is not
      # laid out that way and the pages are exact-name pairs.
      docs_structure: suffix
      # A page with no `.en.md` counterpart falls back to the Chinese file
      # rather than 404ing, which keeps the English nav tree complete.
      fallback_to_default: true
      # Let the plugin re-point Material's own `lang`, language switcher and
      # `extra.alternates` per locale. This is the plugin default; spelled out
      # because the switcher is the only way users reach `/en/`.
      reconfigure_material: true

      languages:
        # Default language → built at the site root `/`.
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: KasugaLibNext 文档

        # Second language → built at `/en/`.
        - locale: en
          name: English
          build: true
          site_name: KasugaLibNext Documentation
          # Maps the Chinese nav labels written in `nav:` below to their
          # English counterparts. Every value is copied verbatim from the H1 of
          # the corresponding `*.en.md` page, so the English nav reads as
          # "the page's own title", not as a translation of a translation.
          nav_translations:
