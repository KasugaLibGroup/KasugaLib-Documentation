# --- Markdown extensions -----------------------------------------------------
#
# Declaring `markdown_extensions:` REPLACES MkDocs' built-in default list
# (['toc', 'tables', 'fenced_code']), so anything the prose relies on has to be
# re-declared here or it silently degrades.
#
# Only extensions for syntax the prose actually uses are listed — no
# admonition, footnotes, content tabs, math, images, inline HTML, front matter
# or attr_list appear anywhere in the 152 pages.

markdown_extensions:
  - toc:
      permalink: true
      # Load-bearing and non-obvious. Markdown's stock slugifier DROPS
      # non-ASCII characters, so a heading like `## 验证入口` produces an empty
      # slug and falls back to `_1`, `_2`, … — every Chinese anchor link in the
      # docs would break. The 16 in-page anchor links (8 Chinese, 8 English)
      # were authored against a Unicode-preserving slugifier, so it is swapped
      # in explicitly here.
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode

  # Pipe tables are used throughout the prose; this is the re-declaration of
  # the default that would otherwise be dropped (see above).
  - tables

  # NOTE — `fenced_code` is deliberately ABSENT, and that is not an oversight.
  # The obvious move is to re-declare it alongside `tables`, but it must not be
  # listed: PyMdown's usage notes state that SuperFences *replaces*
  # `markdown.extensions.fenced_code` and that the two "cannot be loaded at the
  # same time" — listing both is undefined behaviour.
  # (https://facelessuser.github.io/pymdown-extensions/usage_notes/)
  # SuperFences, configured below, is what actually renders the 592 fenced code
  # blocks, including the Pygments syntax highlighting they rely on. So code
  # fences are covered; only the *extension name* differs from the default.

  # SuperFences turns the 28 ```mermaid fences (flowchart / sequenceDiagram)
  # into real diagrams. Material for MkDocs ships the Mermaid runtime and
  # renders any element carrying the `mermaid` class, so no extra JavaScript
  # needs to be wired up.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Task lists (`- [ ] …`) are used in guides/data-driven/guide-extension.md and
  # its English counterpart; without this they render as literal "[ ]" text.
  - pymdownx.tasklist:
      custom_checkbox: true

# --- Link validation ---------------------------------------------------------
#
# There is deliberately NO `validation:` block. MkDocs' link and anchor checks
# are left at their defaults (INFO level) so a stale anchor can never fail the
# build. Do NOT promote `validation.links.anchors` or
# `validation.links.unrecognized_links` to `warn`, and do not run CI with
# `mkdocs build --strict` — the build must not gate on link hygiene.

# --- Navigation --------------------------------------------------------------
#
# Hand-maintained on purpose (the project decided against a plugin-generated
# nav). Rules applied here:
#
#   * Paths are the CHINESE files (`X.md`). Never write `X.en.md` — the i18n
#     plugin maps the path to the English file automatically.
#   * Every label is the page's real H1, copied verbatim. Do not "improve" a
#     label; if a heading is renamed upstream, this file has to follow.
#   * Every section title is likewise the H1 of that directory's README.md,
#     which `navigation.indexes` turns into the clickable section landing page.
#   * All 76 Chinese pages appear exactly once.
#
# `guides/data-driven/` is the one sub-directory with no index page, so its
# three pages are listed directly under 指南 instead of being wrapped in a
# title-less group.
#
# The English tree reuses this structure and swaps labels via
# `plugins.i18n.languages[en].nav_translations` above.

